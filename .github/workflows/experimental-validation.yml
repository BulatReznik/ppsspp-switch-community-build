name: Experimental validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release

jobs:
  build:
    name: build (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: clang-normal
            extra: linux
            cc: clang
            cxx: clang++
            args: ./b.sh --headless --unittest
          - id: gcc-normal
            extra: linux
            cc: gcc
            cxx: g++
            args: ./b.sh --headless --unittest
          - id: android-arm64
            extra: android
            cc: clang
            cxx: clang++
            args: cd android && ./ab.sh -j2 APP_ABI=arm64-v8a UNITTEST=1 HEADLESS=1

    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        if: matrix.extra == 'android'
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Install Linux dependencies
        if: matrix.extra == 'linux'
        run: |
          sudo add-apt-repository -y "deb http://archive.ubuntu.com/ubuntu $(lsb_release -sc) main universe restricted multiverse"
          sudo apt-get update -y -qq
          sudo apt-get install libsdl2-dev libgl1-mesa-dev libglu1-mesa-dev libsdl2-ttf-dev libfontconfig1-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03
        with:
          key: experimental-${{ matrix.id }}

      - name: Execute build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_CCACHE: ccache
          USE_CCACHE: 1
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          if [ "${{ matrix.extra }}" = "android" ]; then
            export CCACHE_FILECLONE=true
            export CCACHE_DEPEND=true
            export CCACHE_COMPILERCHECK=content
          fi
          ${{ matrix.args }}

  test-headless-alpine:
    name: test-headless-alpine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: alpine:latest
      options: --shm-size=8g
    steps:
      - name: Install Linux dependencies
        run: apk add build-base wget git bash cmake python3 glu-dev sdl2-dev

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fix repository ownership
        run: chown -R $(id -u):$(id -g) "$PWD"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03
        with:
          key: experimental-alpine

      - name: Compile FFmpeg
        run: cd ffmpeg && ./linux_x86-64.sh

      - name: Build for testing
        run: ./b.sh --headless --unittest

      - name: Execute unit tests
        run: ./build/PPSSPPUnitTest ALL

      - name: Execute headless tests
        run: python test.py -g --graphics=software
